[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=69", "setuptools-scm>=8" ]

[project]
name = "minimal-cli"
description = "A minimal CLI tool scaffold"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Brian Cho", email = "briandcho@yahoo.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
optional-dependencies.dev = [
  "covdefaults",
  "pytest-cov",
]
scripts.minimal-cli = "minimal_cli:main"

[tool.setuptools]
packages.find.exclude = [ "tests", "tests.*" ]
package-dir = { "" = "." }

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.mypy]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
overrides = [ { module = "tests.*", disallow_untyped_defs = false } ]

[tool.coverage]
run.plugins = [ "covdefaults" ]

[tool.tox]
legacy_tox_ini = '''
[tox]
env_list = py, pre-commit

[testenv]
description = Run pytest with coverage
# usedevelop installs the project package (editable) into the env; without it,
# __version__'s importlib.metadata lookup in minimal_cli.py raises PackageNotFoundError.
usedevelop = true
deps = -r requirements-dev.txt
pass_env = PYTHONPATH
commands =
    coverage erase
    coverage run -m pytest
    coverage report --show-missing

[testenv:pre-commit]
description = Run pre-commit hooks on all files
deps = pre-commit
skip_install = true
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:update_deps]
description = Update requirements*.txt files and pre-commit hooks
deps =
    pip-tools
    pre-commit
skip_install = true
commands =
    pip-compile pyproject.toml --generate-hashes
    pip-compile pyproject.toml --extra dev --output-file=requirements-dev.txt
    pre-commit autoupdate
'''

[tool.commitizen]
name = "cz_conventional_commits"
