name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tags this template repo itself (vX.Y.Z, from Conventional Commits) so `copier copy`/
      # `copier update` (which default to the latest tag) always resolve to a current template --
      # including the requirements*.txt refreshed by deps-update.yml, so this needs to run on
      # every push to main, not just on a deliberate manual trigger. No pypi_token: this repo
      # isn't a published package — only the *generated* project (via
      # template/.github/workflows/release.yml, still manual-only) publishes to PyPI.
      # `semantic-release version` is a no-op when there's nothing releasable since the last tag,
      # so this is safe to run unconditionally. No changelog: a tracked CHANGELOG.md duplicates
      # the GitHub Release notes this step already publishes, and nothing in this repo consumes
      # it (it isn't installed as a package).
      - name: Install python-semantic-release
        run: pip install python-semantic-release==9.8.6

      - name: Run Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version --no-changelog --no-commit
