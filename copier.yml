_subdirectory: template
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if not include_dep_automation %}.github/workflows/auto-update-deps.yml{% endif %}"
  - "{% if not include_dep_automation %}.github/dependabot.yml{% endif %}"

project_name:
  type: str
  help: "Project name (kebab-case, e.g. my-project)"
  default: my-project
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    project_name must be lowercase kebab-case (letters, digits, hyphens), starting with a letter
    {% endif %}

python_module:
  type: str
  when: false
  default: "{{ project_name.replace('-', '_') }}"

description:
  type: str
  help: "Short project description"
  default: "A minimal CLI tool scaffold"

author_name:
  type: str
  help: "Your name"

author_email:
  type: str
  help: "Your email"
  validator: >-
    {% if '@' not in author_email %}
    author_email must be a valid email address
    {% endif %}

include_dep_automation:
  type: bool
  help: "Include a scheduled workflow that opens PRs to keep dependencies and Actions pins current?"
  default: true
